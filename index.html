<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<meta name="author" content="Fabrício Silva">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Where People Live</title>
	<link rel="stylesheet" href="wherepeoplelive.css"/>
	<link rel="stylesheet" href="leaflet-1.9.4.css"/>
	<script src="leaflet-1.9.4-min.js"></script>
	<script src="turf-7.4.0-min.js"></script>
	<script defer src="https://cloud.umami.is/script.js" data-website-id="f39613ea-2615-4aa1-8ae1-6ce0f81a6a5b"></script>
	<script src="wherepeoplelive.js"></script>
</head>
<body class="fullscreen">
	<div id="game" class="fullscreen">
		<div id="map"></div>
		<div id="panel">
			<div id="countryBars"></div>
			<div id="message"></div>
			<div id="toolbar">
				<input type="text" id="search" autocomplete="off" spellcheck="false" onkeydown="searchName()">
				<input type="checkbox" checked id="showGuessedLabels" onchange="showGuessedLabels()">
				<input type="checkbox" checked id="showRevealedLabels" onchange="showRevealedLabels()">
				<input type="checkbox" checked id="showCountryLabels" onchange="showCountryLabels()">
				<input type="checkbox" checked id="showCountryBoundaries" onchange="showCountryBoundaries()">
				<div id="pointsPop" class="pointsPop"></div>
				<input type="button" id="restartGame" value="X" onclick="restartGame()">
				<input type="button" id="showSplash" value="?" onclick="showSplash()">
			</div>
		</div>
		<div id="rightPanel">
			<div id="rightBars"></div>
		</div>
	</div>
	<div id="capitalGlow"></div>
	<div id="splash" class="fullscreen">
		<div id="closeSplash" onclick="closeSplash()">&#x2715;</div>
		<img id="titleImage" src="title.webp" alt="Where People Live">
		<div id="splashDescription" data-i18n="I8N_SPLASH_DESCRIPTION"></div>
		<div id="progressBar">
			<div id="progressBarFill"></div>
			<span id="progressBarLabel" data-i18n="I8N_LOADING"></span>
		</div>
		<div class="splash-footer">
			<span data-i18n="I8N_SPLASH_BY"></span><span> Fabrício Silva</span><br/>
			<a href="https://github.com/fabriciodosanjossilva/wherepeoplelive" target="_blank" rel="noopener">
				<img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="gh-icon">
			</a>
		</div>
	</div>
	<script>
	window.onload = function() { init() };
	</script>
</body>
</html>
